<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата не пройшла — Leckar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fdfcf9;color:#2d2418;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:420px}
.icon{font-size:56px;margin-bottom:20px}
h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:500;margin-bottom:12px}
p{font-size:15px;color:#6b5c48;font-weight:300;line-height:1.6;margin-bottom:28px}
a{display:inline-block;background:#c4622e;color:#fff;font-size:15px;font-weight:500;padding:14px 32px;border-radius:50px;text-decoration:none;margin:0 6px}
.alt{background:transparent;border:1.5px solid rgba(45,36,24,.1);color:#6b5c48}
</style>
</head>
<body>
<div class="box">
  <div class="icon">😕</div>
  <h1>Оплата не пройшла</h1>
  <p>Щось пішло не так під час оплати карткою. Ви можете спробувати ще раз або оформити замовлення з оплатою при отриманні.</p>
  <a href="/">Спробувати знову</a>
</div>
</body>
</html>
